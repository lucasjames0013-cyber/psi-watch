<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSI Watch</title>
<style>
body{margin:0;background:#0b0d10;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
main{max-width:700px;margin:auto;padding:14px}
h1{margin:5px}.status{font-size:20px;font-weight:700;margin:8px}
#reading{font-size:64px;font-weight:800;margin:5px}
video{width:100%;max-height:55vh;background:#000;border-radius:14px}
.wrap{position:relative}.box{position:absolute;left:18%;top:32%;width:64%;height:30%;border:4px solid #ffd60a;border-radius:10px;box-sizing:border-box;pointer-events:none}
button{font-size:20px;padding:14px 20px;margin:7px;border:0;border-radius:12px;font-weight:700}
#start{background:#30d158}#stop{background:#ff453a;color:white}#test{background:#ffd60a}
.small{opacity:.75;font-size:14px}.alarm{background:#7a0000}.safe{background:#0b0d10}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body><main>
<h1>PSI Watch</h1>
<div class="status">LOW ≤ 2200 &nbsp; | &nbsp; HIGH ≥ 2700</div>
<div id="reading">----</div>
<div id="state">Not monitoring</div>
<div class="wrap"><video id="video" playsinline muted></video><div class="box"></div></div>
<button id="start">START MONITORING</button><button id="stop">STOP</button><br>
<button id="test">TEST ALARM</button>
<p class="small">Keep the yellow box tightly over ONLY the large PSI digits. Keep Safari open and the screen awake.</p>
<canvas id="canvas" hidden></canvas>
</main>
<script>
const LOW=2200,HIGH=2700;
const v=document.querySelector('#video'), c=document.querySelector('#canvas'), ctx=c.getContext('2d');
const reading=document.querySelector('#reading'), state=document.querySelector('#state');
let stream=null,running=false,badCount=0,lastBad=null,worker=null,audioCtx=null;

function beep(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 let o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.frequency.value=880; g.gain.value=.5;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.45);
 if(navigator.vibrate) navigator.vibrate([500,200,500,200,800]);
}
function alarm(kind,val){
 document.body.className='alarm'; state.textContent=(kind==='LOW'?'🚨 LOW PRESSURE ':'🚨 HIGH PRESSURE ')+val+' PSI';
 beep(); setTimeout(()=>{if(running && document.body.className==='alarm') beep()},900);
}
function safe(val){document.body.className='safe';state.textContent='✓ NORMAL';}
async function start(){
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  v.srcObject=stream;await v.play();running=true;badCount=0;lastBad=null;
  if(!worker){state.textContent='Loading number reader…';worker=await Tesseract.createWorker('eng');}
  state.textContent='Monitoring…'; scan();
 }catch(e){state.textContent='Camera error: '+e.message;}
}
function stop(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;document.body.className='safe';state.textContent='Stopped';reading.textContent='----';}
async function scan(){
 if(!running)return;
 if(v.videoWidth){
  // Crop same proportions as visible yellow box: x18%, y32%, w64%, h30%
  let sx=v.videoWidth*.18, sy=v.videoHeight*.32, sw=v.videoWidth*.64, sh=v.videoHeight*.30;
  c.width=Math.max(1,sw);c.height=Math.max(1,sh);ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  try{
   let r=await worker.recognize(c);
   let nums=(r.data.text||'').replace(/[^\d]/g,'');
   let matches=nums.match(/\d{3,5}/g);
   let val=matches?parseInt(matches[0]):NaN;
   if(Number.isFinite(val) && val>=0 && val<=20000){
    reading.textContent=val+' PSI';
    let kind=val<=LOW?'LOW':val>=HIGH?'HIGH':'SAFE';
    if(kind==='SAFE'){badCount=0;lastBad=null;safe(val);}
    else{
      if(lastBad===kind) badCount++; else {lastBad=kind;badCount=1;}
      state.textContent=`${kind} reading ${badCount}/3 — ${val} PSI`;
      if(badCount>=3) alarm(kind,val);
    }
   }else{state.textContent='Looking for PSI digits…';badCount=0;lastBad=null;}
  }catch(e){state.textContent='Reader error — trying again';}
 }
 if(running)setTimeout(scan,250);
}
document.querySelector('#start').onclick=start;
document.querySelector('#stop').onclick=stop;
document.querySelector('#test').onclick=()=>{beep();state.textContent='🚨 ALARM TEST';setTimeout(()=>state.textContent=running?'Monitoring…':'Not monitoring',1500)};
</script></body></html>
