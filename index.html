<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSI Watch Precision</title>
<style>
body{margin:0;background:#0b0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;transition:.15s}main{max-width:700px;margin:auto;padding:12px}h1{margin:4px}.status{font-size:18px;font-weight:750;margin:6px}#reading{font-size:68px;font-weight:900;letter-spacing:3px;margin:2px}#prefix{font-size:16px;opacity:.85;min-height:22px}#state{font-size:22px;font-weight:800;min-height:30px;margin:5px}.wrap{position:relative}video{width:100%;max-height:55vh;background:#000;border-radius:14px}.box{position:absolute;left:20%;top:35%;width:60%;height:24%;border:4px solid #ffd60a;border-radius:10px;box-sizing:border-box;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}button{font-size:19px;padding:13px 18px;margin:6px;border:0;border-radius:12px;font-weight:800}#start{background:#30d158}#stop{background:#555;color:#fff}#test{background:#ffd60a}#ack{background:#fff;color:#b00000;display:none}.small{opacity:.8;font-size:14px;line-height:1.35}.alarm{background:#8d0000}.lost{background:#5b4300}.safe{background:#0b0d10}.meter{font-size:13px;opacity:.75}canvas{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="safe"><main>
<h1>PSI Watch — Precision</h1>
<div class="status">LOW: 22XX or below &nbsp; | &nbsp; HIGH: 27XX or above</div>
<div id="reading">----</div><div id="prefix">First two digits decide the alarm</div>
<div id="state">Not monitoring</div><div id="confidence" class="meter"></div>
<div class="wrap"><video id="video" playsinline muted></video><div class="box"></div></div>
<button id="start">START MONITORING</button><button id="stop">STOP</button><br>
<button id="ack">ACKNOWLEDGE ALARM</button><button id="test">TEST ALARM</button>
<p class="small">Put the yellow box tightly around ONLY the four pressure digits. The app rejects anything that is not exactly 4 digits and checks the first two digits across several reads.</p>
<canvas id="raw"></canvas><canvas id="proc"></canvas>
</main>
<script>
const LOW_PREFIX=22,HIGH_PREFIX=27;
const v=document.querySelector('#video'),raw=document.querySelector('#raw'),proc=document.querySelector('#proc');
const rctx=raw.getContext('2d',{willReadFrequently:true}),pctx=proc.getContext('2d',{willReadFrequently:true});
const reading=document.querySelector('#reading'),state=document.querySelector('#state'),prefixEl=document.querySelector('#prefix'),confEl=document.querySelector('#confidence'),ack=document.querySelector('#ack');
let stream=null,running=false,worker=null,audioCtx=null,alarmTimer=null,latched=false;
let history=[],lastGoodAt=0,scanBusy=false;

function beep(){
 try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=1050;g.gain.value=.65;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.55);if(navigator.vibrate)navigator.vibrate([600,150,600,150,900]);}catch(e){}
}
function startAlarm(kind,val){
 if(latched)return;latched=true;document.body.className='alarm';ack.style.display='inline-block';state.textContent=`🚨 ${kind} PRESSURE — ${val}`;beep();alarmTimer=setInterval(beep,1100);
}
function acknowledge(){latched=false;clearInterval(alarmTimer);alarmTimer=null;ack.style.display='none';document.body.className='safe';state.textContent=running?'Alarm acknowledged — monitoring…':'Alarm acknowledged';history=[];}
function classify(s){let p=parseInt(s.slice(0,2),10);return p<=LOW_PREFIX?'LOW':p>=HIGH_PREFIX?'HIGH':'SAFE';}
function consensus(){
 const recent=history.slice(-3);if(recent.length<2)return null;
 const counts={LOW:0,HIGH:0,SAFE:0};recent.forEach(x=>counts[x.kind]++);
 if(counts.LOW>=2)return 'LOW';if(counts.HIGH>=2)return 'HIGH';if(counts.SAFE>=2)return 'SAFE';return null;
}
function preprocess(){
 // Crop matches yellow box: x20%, y35%, w60%, h24%. Upscale 3x for OCR.
 const sx=v.videoWidth*.20,sy=v.videoHeight*.35,sw=v.videoWidth*.60,sh=v.videoHeight*.24;
 raw.width=Math.max(1,Math.round(sw));raw.height=Math.max(1,Math.round(sh));rctx.drawImage(v,sx,sy,sw,sh,0,0,raw.width,raw.height);
 const scale=3;proc.width=raw.width*scale;proc.height=raw.height*scale;pctx.imageSmoothingEnabled=false;pctx.drawImage(raw,0,0,proc.width,proc.height);
 const im=pctx.getImageData(0,0,proc.width,proc.height),d=im.data;
 // grayscale + strong contrast; threshold adapts from average brightness
 let sum=0;for(let i=0;i<d.length;i+=4)sum+=(d[i]*.299+d[i+1]*.587+d[i+2]*.114);let avg=sum/(d.length/4);let threshold=Math.max(75,Math.min(190,avg));
 for(let i=0;i<d.length;i+=4){let y=d[i]*.299+d[i+1]*.587+d[i+2]*.114;let z=y>threshold?255:0;d[i]=d[i+1]=d[i+2]=z;}
 pctx.putImageData(im,0,0);
}
function exactFour(text){
 // Every valid pressure is exactly four digits. Never manufacture a reading from 3 or 5 digits.
 const groups=(text||'').match(/\d+/g)||[];const exact=groups.filter(x=>x.length===4);return exact.length===1?exact[0]:null;
}
async function start(){
 try{
  if(running)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});v.srcObject=stream;await v.play();
  running=true;history=[];lastGoodAt=Date.now();
  if(!worker){state.textContent='Loading precision reader…';worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7',preserve_interword_spaces:'0'});}
  state.textContent='Monitoring…';scan();
 }catch(e){running=false;state.textContent='Camera error: '+e.message;}
}
function stop(){running=false;scanBusy=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(latched)acknowledge();document.body.className='safe';state.textContent='Stopped';reading.textContent='----';prefixEl.textContent='First two digits decide the alarm';confEl.textContent='';history=[];}
async function scan(){
 if(!running||scanBusy)return;scanBusy=true;
 try{
  if(v.videoWidth){
   preprocess();let res=await worker.recognize(proc);let s=exactFour(res.data.text);let confidence=Math.round(res.data.confidence||0);confEl.textContent=`OCR confidence: ${confidence}% • Valid reads: ${history.length}`;
   if(s){
    lastGoodAt=Date.now();let kind=classify(s);history.push({s,kind,t:Date.now()});if(history.length>5)history.shift();reading.textContent=s;prefixEl.textContent=`Prefix ${s.slice(0,2)} → ${kind}`;
    let vote=consensus();
    if(!latched){
     if(vote==='LOW'||vote==='HIGH')startAlarm(vote,s);
     else if(vote==='SAFE'){document.body.className='safe';state.textContent='✓ NORMAL — monitoring';}
     else state.textContent=`Confirming ${kind} reading…`;
    }
   }else{
    if(!latched){let lost=Date.now()-lastGoodAt;if(lost>3000){document.body.className='lost';state.textContent='⚠️ READING LOST — reposition digits';reading.textContent='????';}else state.textContent='Rejecting unclear read — trying again…';}
   }
  }
 }catch(e){if(!latched)state.textContent='Reader error — retrying';}
 scanBusy=false;if(running)setTimeout(scan,40);
}
document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=stop;document.querySelector('#ack').onclick=acknowledge;document.querySelector('#test').onclick=()=>{if(!latched)startAlarm('TEST','----');};
</script></body></html>
